version: '3.8'

services:
  mysql:
    image: mysql:8.0.36
    platform: linux/amd64
    container_name: student_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
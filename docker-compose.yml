services:
  mysql:
    image: mysql:8.0
    container_name: student_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_management
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ularavel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: student_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: StudentManagement
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: student_management
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser runs on the host, so it must reach the backend via localhost
        VITE_API_URL: http://localhost:8000/api
    container_name: student_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data: